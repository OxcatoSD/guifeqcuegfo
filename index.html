<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux World</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/styles.css">
</head>

<body>

    <div id="fondo"></div>

    <!-- PANTALLA DE INICIO -->
    <div id="pantalla-inicio">
        <h2>🔮 Lux World</h2>
        <p>¿Cómo te llamas, cuidador?</p>
        <input type="text" id="input-nombre" placeholder="Tu nombre..." maxlength="12" autocomplete="off">
        <button id="btn-empezar">Comenzar</button>
    </div>

    <!-- CONTADOR -->
    <div class="score-container">
        <span class="score-label">Pat-pats:</span>
        <div class="score" id="score">0</div>
    </div>

    <!-- BOTÓN PARA MOSTRAR/OCULTAR TABLA (Solo visible en móviles) -->
    <button id="btnToggleLeaderboard">🏆</button>

    <!-- TABLA DE RÉCORDS -->
    <div class="leaderboard" id="leaderboardPanel">
        <h3>🏆 Récords</h3>
        <ol id="leaderboard-list"></ol>
    </div>

    <h1>Acaricia a Hupibot</h1>

    <!-- BOTÓN Y MINI HUPIBOT -->
    <div class="click-area">
        <button class="click-btn" id="clickBtn">
            <img src="img/IMG-20261018-WA0030.jpg" id="btnImage" alt="Botón">
        </button>

        <img src="img/minihupibot/idle.png" id="sideImage" class="side-animation" style="display: none;"
            alt="Mini Hupibot">
    </div>

    <!-- BARRA DE MISIONES -->
    <div id="mission-bar">
        <div id="mission-list"></div>
    </div>

    <!-- SONIDOS -->
    <audio id="dogToySound" src="sound/freesound_community-squeaky-toy-1-6059.mp3" preload="auto"></audio>
    <audio id="crakckedSound" src="sound/audiopapkin-squeak-metal-ps-016-389413.mp3" preload="auto"></audio>
    <audio id="rockSound" src="sound/rock.mp3" preload="auto"></audio>

    <script src="script/script.js"></script>

</body>

</html>
